[project]
name = "fava-envelope"
version = "0.5.9"
description = ""
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
keywords = ["fava", "budget", "envelope"]
authors = [
  {email = "me@brianryall.xyz"},
  {name = "Brian Ryall"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fava>=1.26",
    "Click >= 7",
    "beanquery>=0.2.0",
    "beancount>=3.0.0",
    "pytest>=8.3.4",
    "polars>=1.36.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
[tool.uv]
override-dependencies = [
    # tatsu-lts pretty consistently fails to build on my machine, I think something with the codegen is failing.
    "tatsu-lts==5.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/polarmutex/fava-envelope"
documentation = "https://github.com/polarmutex/fava-envelope"
repository = "https://github.com/polarmutex/fava-envelope"
changelog = "https://github.com/polarmutex/fava-envelope/master/CHANGELOG.md"

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.lint]
select = [
    "F", # flake8
    "E", # pycodestyle
    "W", # pycodestyle
    # "C90",    # McCabe cyclomatic complexity
    "I", # isort
    "N", # pep8-naming
    # "D", # docstyle
    "UP", # pyupgrade
    # "PD", # pandas-vet
]

[tool.basedpyright]
# many settings are not enabled even in strict mode, which is why basedpyright includes an "all" option
# you can then decide which rules you want to disable
typeCheckingMode = "standard"
exclude = [
    ".venv",
    ".direnv",
]
useLibraryCodeForTypes = true
venvPath="."
venv=".venv"

